[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diprofiler"
version = "0.1.0"
description = "Profiles data pipeline requests and recommends the best query engine based on dataset characteristics."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "y0kaiNearU", email = "abeku20@freeuni.edu.ge" }]
dependencies = [
    "narwhals>=1.0",
    "packaging>=24.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
duckdb = ["duckdb>=1.5.3"]
polars = ["polars>=1.42.1"]
dask = ["dask[dataframe,distributed]>=2026.7.0"]
spark = ["pyspark>=3.5"]
arrow = ["pyarrow>=24.0.0"]
modin = ["modin[dask]>=0.37.1"]
ml = ["numpy>=2.0", "scikit-learn>=1.4", "joblib>=1.3"]
llm = ["anthropic>=0.109.1"]
openai = ["openai>=1.0"]
all = [
    "pandas>=2.0",
    "duckdb>=1.5.3",
    "polars>=1.42.1",
    "dask[dataframe,distributed]>=2026.7.0",
    "pyspark>=3.5",
    "pyarrow>=24.0.0",
    "modin[dask]>=0.37.1",
    "numpy>=2.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "anthropic>=0.109.1",
    "openai>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[dependency-groups]
# Everything needed to run the full test suite locally (every engine adapter
# is exercised, so every engine's package must be installed here — this is
# the one place where "install everything" is intentional).
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.14",
    "pandas>=2.0",
    "duckdb>=1.5.3",
    "polars>=1.42.1",
    "dask[dataframe,distributed]>=2026.7.0",
    "pyspark>=3.5",
    "pyarrow>=24.0.0",
    "modin[dask]>=0.37.1",
    "numpy>=2.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]
# Everything examples/*.py need (see examples/README.md). Anthropic is
# included so 04_llm_prefetch.py works out of the box, given an API key;
# pyspark is deliberately left out since it needs Java installed separately
# and 05_benchmark.py already skips it gracefully when absent.
examples = [
    "matplotlib>=3.9",
    "pandas>=2.0",
    "duckdb>=1.5.3",
    "polars>=1.42.1",
    "dask[dataframe,distributed]>=2026.7.0",
    "numpy>=2.0",
    "scikit-learn>=1.4",
    "anthropic>=0.109.1",
]
