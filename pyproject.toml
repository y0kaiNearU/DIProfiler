[project]
name = "diprofiler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "matplotlib>=3.9",
    "scikit-learn>=1.4",
    "narwhals>=1.0",
    "duckdb>=1.5.3",
    "datafusion>=53.0.0",
    "pyarrow>=24.0.0",
    "anthropic>=0.109.1",
    "polars>=1.42.1",
    "dask[dataframe,distributed]>=2026.7.0",
    "packaging>=24.0",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.0"]
datafusion = ["datafusion>=40.0", "pyarrow>=17.0"]
polars = ["polars>=1.0"]
dask = ["dask[dataframe,distributed]>=2024.1.0"]
llm = ["anthropic>=0.40"]
openai = ["openai>=1.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[dependency-groups]
dev = [
    "reportlab>=4.5.1",
]
